# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: robolamp
  friendly_name: Bedside Lamp

esp32:
  board: esp32-c5-devkitc-1
  framework:
    type: esp-idf

  variant: ESP32C5
logger:
  baud_rate: 115200

api:
  encryption:
    key: "9ZuXk2Vc2FIx0fga785INu9aKEyg53P19mgFGsIixQI="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  band_mode: 2.4GHZ
  ap:
    ssid: Lamp Fallback Hotspot
    password: "6FScb1dtDprD"
    
captive_portal:

uart:
  - baud_rate: 115200
    rx_pin: GPIO11
    tx_pin: GPIO10
    id: uart_1

serial_proxy:
  - name: Arduino
    uart_id: uart_1
    port_type: TTL
    id: serial_proxy_1

# # Example configuration entry
# switch:
#   - platform: uart
#     name: "Bedside Lamp"
#     uart_id: uart_1
#     data:
#       turn_on: "lightson\n"
#       turn_off: "lightsoff\n"
#     restore_mode: ALWAYS_OFF

globals:
  - id: red_val
    type: float
    initial_value: '0'
  - id: green_val
    type: float
    initial_value: '0'
  - id: blue_val
    type: float
    initial_value: '0'
  - id: cw_val
    type: float
    initial_value: '0'
  - id: ww_val
    type: float
    initial_value: '0'

interval:
  - interval: 40ms  
    then:
      - lambda: |-
          static int last_sent_hue = -1;
          static int last_sent_bri = -1;
          static std::string last_sent_tone = "";
          static bool is_on = false;

          static float saved_ha_brightness = 1.0; 
          static float last_target_h = -1.0;
          static float last_target_ct = -1.0;
          
          static bool is_color_mode = true;

          auto values = id(bedside_lamp)->remote_values;
          bool target_is_on = values.is_on();
          float target_master_bri = values.get_brightness();

          if (target_is_on && target_master_bri > 0.01) {
            saved_ha_brightness = target_master_bri;
          }

          float tr = values.get_red();
          float tg = values.get_green();
          float tb = values.get_blue();
          float tv = std::max(tr, std::max(tg, tb));
          float t_min = std::min(tr, std::min(tg, tb));
          float t_delta = tv - t_min;
          
          float t_h = last_target_h; 
          if (tv > 0.001 && t_delta > 0.001) {
            if (tv == tr) t_h = 60.0 * (tg - tb) / t_delta;
            else if (tv == tg) t_h = 60.0 * (2.0 + (tb - tr) / t_delta);
            else t_h = 60.0 * (4.0 + (tr - tg) / t_delta);
            while (t_h < 0.0) t_h += 360.0;
            while (t_h >= 360.0) t_h -= 360.0;
          }
          
          float t_ct = values.get_color_temperature();

          if (t_h != last_target_h && last_target_h != -1.0) is_color_mode = true;
          if (t_ct != last_target_ct && last_target_ct != -1.0) is_color_mode = false;

          if (!target_is_on) {
            bool color_changed = (last_target_h != -1.0 && std::abs(t_h - last_target_h) > 1.0);
            bool tone_changed = (last_target_ct != -1.0 && std::abs(t_ct - last_target_ct) > 1.0);

            if (color_changed || tone_changed) {
              auto call = id(bedside_lamp)->turn_on();
              call.set_brightness(saved_ha_brightness);
              call.perform();
              
              if (color_changed) is_color_mode = true;
              if (tone_changed) is_color_mode = false;
              
              last_target_h = t_h;
              last_target_ct = t_ct;
              return; 
            }
          }

          last_target_h = t_h;
          last_target_ct = t_ct;

          float r = id(red_val);
          float g = id(green_val);
          float b = id(blue_val);
          float cw = id(cw_val);
          float ww = id(ww_val);

          float current_v = std::max(r, std::max(g, b));
          float current_w = std::max(cw, ww);
          float current_bri = std::max(current_v, current_w);

          if (current_v > current_w + 0.1) is_color_mode = true;
          else if (current_w > current_v + 0.1) is_color_mode = false;

          if (current_bri > 0.001) {
            
            if (!is_on) {
              id(uart_1).write_str("lon\n");
              id(uart_1).write_str("bri:0\n");
              last_sent_bri = 0;
              is_on = true;
              return; 
            }

            if (is_color_mode) {
              if (tv > 0.001 && t_delta > 0.001) { 
                int final_hue = last_sent_hue; 
                if (t_h < 12 || t_h >= 348) { final_hue = 10; }           
                else if (t_h >= 12 && t_h < 38) { final_hue = 3800; }     
                else if (t_h >= 38 && t_h < 75) { final_hue = 8000; }     
                else if (t_h >= 75 && t_h < 105) { final_hue = 15500; }   
                else if (t_h >= 105 && t_h < 165) { final_hue = 22000; }  
                else if (t_h >= 165 && t_h < 205) { final_hue = 31000; }  
                else if (t_h >= 205 && t_h < 265) { final_hue = 42000; }  
                else if (t_h >= 265 && t_h < 290) { final_hue = 48000; }  
                else if (t_h >= 290 && t_h < 348) { final_hue = 62000; }  

                // ONLY sends if the color bucket actually changed
                if (final_hue != last_sent_hue && final_hue != -1) {
                  last_sent_hue = final_hue;
                  std::string hue_cmd = "hue:" + to_string(final_hue) + "\n";
                  id(uart_1).write_str(hue_cmd.c_str());
                }
              }
              last_sent_tone = ""; 
              
            } else {
              std::string current_tone = "both";
              if (t_ct <= 260) { current_tone = "cool"; }
              else if (t_ct >= 390) { current_tone = "warm"; }

              // ONLY sends if the tone actually changed
              if (current_tone != last_sent_tone) {
                last_sent_tone = current_tone;
                std::string tone_cmd = "tones:" + current_tone + "\n";
                id(uart_1).write_str(tone_cmd.c_str());
              }
              last_sent_hue = -1; 
            }

            int val = (int)(current_bri * 255.0);
            
            // BUG FIX: ONLY sends if the exact brightness number changed!
            if (val != last_sent_bri) {
              last_sent_bri = val;
              std::string bri_cmd = "bri:" + to_string(val) + "\n";
              id(uart_1).write_str(bri_cmd.c_str());
            }
          
          } else {
            if (is_on) {
              if (last_sent_bri != 0) {
                id(uart_1).write_str("bri:0\n");
              }
              id(uart_1).write_str("lof\n");
              is_on = false;
            }
            last_sent_bri = 0;
          }
          
light:
  - platform: rgbww
    id: bedside_lamp
    name: "Bedside Lamp"
    red: red_out
    green: green_out
    blue: blue_out
    cold_white: cw_out
    warm_white: ww_out
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    color_interlock: true
    gamma_correct: 1.0     
    # NOTE: on_turn_on and on_turn_off are DELETED! 

          
output:
  - platform: template
    id: red_out
    type: float
    write_action:
      - lambda: 'id(red_val) = state;'
  - platform: template
    id: green_out
    type: float
    write_action:
      - lambda: 'id(green_val) = state;'
  - platform: template
    id: blue_out
    type: float
    write_action:
      - lambda: 'id(blue_val) = state;'
  - platform: template
    id: cw_out
    type: float
    write_action:
      - lambda: 'id(cw_val) = state;'
  - platform: template
    id: ww_out
    type: float
    write_action:
      - lambda: 'id(ww_val) = state;'
        
button:
  - platform: uart
    name: Preset 1
    uart_id: uart_1
    data: "p1\n"
    id: button_uart_1

  - platform: uart
    name: Preset 2
    uart_id: uart_1
    data: "p2\n"
    id: button_uart_2

  - platform: uart
    name: Preset 3
    uart_id: uart_1
    data: "p3\n"
    id: button_uart_3

  - platform: uart
    name: Preset 4
    uart_id: uart_1
    data: "p4\n"
    id: button_uart_4
